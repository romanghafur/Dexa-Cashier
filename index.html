<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Cashier — Demo</title>
<meta name="description" content="NOVA Cashier POS — online demo. Nothing is saved; refresh resets everything.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF1;
  --ink:#37474F;
  --ink-2:#455A64;
  --card:#ffffff;
  --line:#DDE3E7;
  --muted:#7B8B96;
  --green:#2E9E5B;
  --amber:#F2A33C;
  --red:#E74C3C;
  --teal:#00897B;
  --purple:#8E58EB;
  --indigo:#5A70F0;
  --pink:#EC407A;
  --cyan:#00ACC1;
  --r:12px;
  --sh:0 1px 3px rgba(38,50,56,.10), 0 1px 2px rgba(38,50,56,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Kufi Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;
}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  -webkit-font-feature-settings:'liga';font-variation-settings:'opsz' 24;user-select:none;vertical-align:middle}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
.demobar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:#1F2A30;color:#CFD8DC;font-size:12px;flex:0 0 auto}
.demobar b{color:#fff;font-weight:600}
.demobar .spacer{flex:1}
.demobar button{border:1px solid #43535C;border-radius:999px;padding:3px 12px;font-size:12px;color:#ECEFF1}
.demobar button:hover{background:#2C3A42}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;box-shadow:0 0 0 3px rgba(76,175,80,.2)}

.appbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:0 12px;height:56px;flex:0 0 auto}
.appbar .brand{display:flex;align-items:center;gap:8px;font-weight:600}
.appbar .title{flex:1;text-align:center;font-weight:600;font-size:16px}
.appbar .acts{display:flex;align-items:center;gap:4px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.badge{position:absolute;top:4px;inset-inline-end:4px;min-width:15px;height:15px;border-radius:999px;background:var(--red);
  color:#fff;font-size:10px;display:grid;place-items:center;padding:0 3px}
.userchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:13px}

main{flex:1;overflow:auto;padding:12px}
.bottomnav{display:flex;background:#fff;border-top:1px solid var(--line);flex:0 0 auto}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 10px;color:var(--muted);font-size:12px}
.bottomnav button .pill{padding:3px 20px;border-radius:999px;transition:background .15s}
.bottomnav button.on{color:var(--ink);font-weight:600}
.bottomnav button.on .pill{background:#DDE4E8}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.row{display:flex;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.stat{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:var(--r);border:1px solid transparent}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-size:19px;font-weight:700;margin-top:2px}
.stat .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff}
.s-grey{background:#EDF1F3}.s-grey .ic{background:#90A4AE}
.s-teal{background:#E2F3F1}.s-teal .ic{background:var(--teal)}
.s-amber{background:#FDF3E3}.s-amber .ic{background:var(--amber)}
.s-green{background:#E7F5EC}.s-green .ic{background:var(--green)}
.s-purple{background:#F5EAFB}.s-purple .ic{background:var(--purple)}
.s-red{background:#FBEAE8}.s-red .ic{background:var(--red)}

.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:var(--r);padding:10px 14px;box-shadow:var(--sh)}
.searchbar input{flex:1;border:none;background:none;outline:none}
.searchbar .ms{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(.94)}
.btn-fill{background:var(--ink);color:#fff}
.btn-line{background:#fff;border:1px solid var(--line)}
.btn-green{background:var(--green);color:#fff}
.btn-amber{background:var(--amber);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{color:var(--ink-2)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px}
.chip .n{background:#EDF1F3;border-radius:999px;padding:0 7px;font-size:11px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on .n{background:rgba(255,255,255,.22)}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
th{background:#F5F7F8;text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:11px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid #EEF2F4;font-size:13px}
tbody tr:hover{background:#FAFBFC}
.tag{display:inline-block;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:600}
.t-iqd{background:#EEF1F3;color:var(--ink)}
.t-usd{background:#E7F5EC;color:#1B7F45}
.t-sum{background:#E3F0FB;color:#1565A8}
.t-buy{background:#FDF1DE;color:#A96A12}
.t-qty{background:#E7F5EC;color:#1B7F45}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:#B0BEC5;padding:70px 0}
.empty .ms{font-size:56px}

/* ---------- login ---------- */
.login{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg)}
.login .logo{width:76px;height:76px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin-bottom:14px}
.login .logo .ms{font-size:34px}
.login h1{margin:0;font-size:26px;font-weight:700}
.login .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.login .panel{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(38,50,56,.10);padding:16px;width:340px}
.userbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border-radius:12px;background:#F7F9FA;font-weight:700}
.userbtn:hover{background:#EEF2F4}
.userbtn .av{width:32px;height:32px;border-radius:50%;background:#FFF0CC;color:#E6A100;display:grid;place-items:center}
.userbtn .sp{flex:1}
.pinhead{display:flex;align-items:center;gap:10px;padding:4px 4px 12px;border-bottom:1px solid #EEF2F4;font-weight:700}
.dots{display:flex;gap:12px;justify-content:center;padding:20px 0}
.dots i{width:11px;height:11px;border-radius:50%;background:#D5DDE1;transition:.15s}
.dots i.f{background:var(--ink);transform:scale(1.05)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{background:#F2F5F6;border-radius:12px;padding:15px 0;font-size:19px;font-weight:600}
.pad button:hover{background:#E7ECEE}
.pad .back{background:#FDECEA;color:var(--red)}
.login .foot{color:#B0BEC5;font-size:12px;margin-top:18px}
.hint{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
.hint b{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px}

/* ---------- cashier ---------- */
.cashier{display:flex;gap:12px;height:100%}
.cash-main{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.cash-side{width:290px;flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:8px;align-items:center}
.tab{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab .x{color:var(--muted);font-size:16px}
.fkeys{display:flex;gap:6px;overflow-x:auto;background:#2C3A42;padding:8px;border-radius:var(--r)}
.fk{display:flex;align-items:center;gap:6px;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);white-space:nowrap}
.fk .k{background:rgba(255,255,255,.16);border-radius:5px;padding:1px 6px;font-size:11px}
.fk:hover:not(:disabled){background:rgba(255,255,255,.16)}
.curtoggle{display:flex;background:#fff;border-radius:10px;padding:4px;box-shadow:var(--sh)}
.curtoggle button{flex:1;padding:9px;border-radius:8px;font-weight:700;color:var(--muted)}
.curtoggle button.on{background:var(--ink);color:#fff}
.totbox{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between}
.totbox.main{border:1px solid #F0C9A0}
.totbox.main .v{font-size:26px;font-weight:700;color:var(--amber)}
.totbox .v{font-size:18px;font-weight:700}
.totbox .c{color:var(--muted);font-size:12px}
.cart{flex:1;overflow:auto;background:#fff;border-radius:var(--r);box-shadow:var(--sh)}
.line{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #F1F4F6}
.line .nm{flex:1;font-weight:600}
.line .sub{font-size:11px;color:var(--muted);font-weight:400}
.qty{display:flex;align-items:center;gap:6px;background:#F5F7F8;border-radius:9px;padding:3px}
.qty button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.qty button:hover{background:#E4E9EC}
.qty span{min-width:26px;text-align:center;font-weight:700}
.prod-foot{position:sticky;bottom:-12px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin:14px -12px -12px;padding:12px;background:var(--bg);border-top:1px solid var(--line)}
.quickbar{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.qb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:10px;font-size:11px;font-weight:600}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,30,36,.5);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .12s ease}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92dvh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.28);animation:pop .14s ease}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}}
.modal.wide{max-width:760px}
.mhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #EEF2F4}
.mhead h3{margin:0;font-size:17px;flex:1}
.mbody{padding:18px}
.mfoot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid #EEF2F4}
.mfoot .btn{flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:12px;padding:12px;margin-bottom:12px}
.box .bt{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.box-amber{background:#FEF7EC;border:1px solid #F5DDB8}.box-amber .bt{color:#B4780F}
.box-blue{background:#EEF5FC;border:1px solid #CFE0F1}.box-blue .bt{color:#1565A8}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.kv .k{color:var(--muted);font-size:13px}
.kv .v{font-weight:700}
.seg{display:flex;background:#EEF2F4;border-radius:10px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.mini-seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.mini-seg button{padding:9px 13px;font-weight:700;color:var(--muted);font-size:12px}
.mini-seg button.on{background:var(--ink);color:#fff}

/* receipt */
.receipt{background:#fff;width:300px;margin:0 auto;padding:14px;font-size:12px;border:1px dashed #CFD8DC}
.receipt h4{margin:0 0 2px;text-align:center;font-size:16px}
.receipt .c{text-align:center;color:var(--muted);font-size:11px}
.receipt table{box-shadow:none;border-radius:0}
.receipt th,.receipt td{padding:4px 3px;font-size:11px;border-color:#E4EAED}
.receipt th{background:#F4F6F7}
.rsep{border-top:1px dashed #CFD8DC;margin:8px 0}

.toast{position:fixed;bottom:78px;inset-inline-start:50%;transform:translateX(50%);background:#263238;color:#fff;
  padding:11px 18px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .15s}
.rtl-flip{transform:scaleX(-1)}

@media(max-width:980px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .cashier{flex-direction:column;height:auto}
  .cash-side{width:auto;flex-direction:row;flex-wrap:wrap}
  .cash-side>*{flex:1;min-width:140px}
  .quickbar{grid-template-columns:repeat(4,1fr)}
  .cart{min-height:220px}
}
@media(max-width:560px){
  .appbar .title{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .quickbar{grid-template-columns:repeat(3,1fr)}
  .demobar .hide-s{display:none}
}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;position:static}
  .receipt{border:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function toast(msg){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2200);
}
function closeModal(){ $('#modal-root').innerHTML=''; }
function modal(html){
  $('#modal-root').innerHTML = `<div class="backdrop" data-close="1">${html}</div>`;
  const bd = $('#modal-root .backdrop');
  bd.addEventListener('mousedown', e => { if(e.target===bd) closeModal(); });
}

/* ----------------------------- cart math ----------------------------- */
function cartTotalIqd(){
  return cart().items.reduce((s,it)=>{
    const p = prod(it.pid); if(!p) return s;
    return s + (it.unit==='carton' ? p.whole : p.price) * it.qty;
  },0);
}
function cartCount(){ return cart().items.reduce((s,i)=>s+i.qty,0); }
function addToCart(pid, unit='piece'){
  const p = prod(pid); if(!p) return;
  const need = unit==='carton' ? (p.dozen||1) : 1;
  const inCart = cart().items.filter(i=>i.pid===pid)
    .reduce((s,i)=>s + i.qty*(i.unit==='carton'?(p.dozen||1):1),0);
  if(p.qty - inCart < need){ toast(t('outOfStock')); return; }
  const line = cart().items.find(i=>i.pid===pid && i.unit===unit);
  if(line) line.qty++; else cart().items.push({pid,unit,qty:1});
  render();
}
function bumpLine(idx, delta){
  const it = cart().items[idx]; if(!it) return;
  const p = prod(it.pid);
  if(delta>0){
    const per = it.unit==='carton'?(p.dozen||1):1;
    const inCart = cart().items.filter(i=>i.pid===it.pid)
      .reduce((s,i)=>s+i.qty*(i.unit==='carton'?(p.dozen||1):1),0);
    if(p.qty - inCart < per){ toast(t('outOfStock')); return; }
  }
  it.qty += delta;
  if(it.qty<=0) cart().items.splice(idx,1);
  render();
}

function bindCashier(){
  const scan = $('#scan');
  if(scan){
    scan.focus();
    scan.onkeydown = e => {
      if(e.key!=='Enter') return;
      const v = scan.value.trim(); scan.value='';
      if(!v) return;
      const p = S.products.find(x=>x.barcode===v || x.cartonBarcode===v);
      if(!p){ toast(S.lang==='ku'?'بارکۆد نەدۆزرایەوە':'Barcode not found'); return; }
      addToCart(p.id, p.cartonBarcode===v ? 'carton' : 'piece');
    };
  }
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(+b.dataset.add));
  document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>bumpLine(+b.dataset.plus,1));
  document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>bumpLine(+b.dataset.minus,-1));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{cart().items.splice(+b.dataset.del,1);render();});
  document.querySelectorAll('[data-cur]').forEach(b=>b.onclick=()=>{cart().cur=b.dataset.cur;render();});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.active=+b.dataset.tab;render();});
  document.querySelectorAll('[data-closetab]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const i=+b.dataset.closetab;
    S.carts.splice(i,1); if(!S.carts.length) S.carts=[{id:1,items:[],cur:'IQD'}];
    S.active = Math.max(0,Math.min(S.active,S.carts.length-1)); render();
  });
  document.querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.fk;
    if(a==='pay'){ if(cart().items.length) checkoutModal(); }
    else if(a==='newtab'){ S.carts.push({id:Date.now(),items:[],cur:'IQD'}); S.active=S.carts.length-1; render(); }
    else if(a==='clear'){ cart().items=[]; render(); }
    else if(a==='search'){ pickerModal(p=>{addToCart(p.id);closeModal();}); }
    else if(a==='history'){ historyModal(); }
    else toast(S.lang==='ku'?'لە نمایشدا نەکراوەتەوە':'Disabled in the demo');
  });
}

/* checkout */
let CO = null;
function checkoutModal(){
  const total = cartTotalIqd();
  CO = {cur:cart().cur, discMode:'%', disc:0, paid:total, customer:''};
  drawCheckout();
}
function coTotals(){
  const gross = cartTotalIqd();
  const off = CO.discMode==='%' ? gross*(Math.min(CO.disc,100)/100) : Math.min(CO.disc,gross);
  const net = Math.max(0, gross-off);
  return {gross, off, net, change: Math.max(0, (CO.paid||0)-net)};
}
function drawCheckout(){
  const {gross,off,net,change} = coTotals();
  const isUsd = CO.cur==='USD';
  const show = v => isUsd ? usd(v/S.fx) : iqd(v);
  modal(`<div class="modal">
    <div class="mhead"><h3>${t('confirmSale')}</h3>
      <button class="iconbtn" data-x="1" style="color:var(--muted)">${icon('close')}</button></div>
    <div class="mbody">
      <div class="seg">
        <button class="${!isUsd?'on':''}" data-co-cur="IQD">IQD</button>
        <button class="${isUsd?'on':''}" data-co-cur="USD">USD</button>
      </div>
      <div class="kv"><span class="k">${t('total')}</span><span class="v">${show(gross)}</span></div>
      ${off>0?`<div class="kv"><span class="k">${t('discount')}</span><span class="v" style="color:var(--red)">− ${show(off)}</span></div>
      <div class="kv"><span class="k">${t('total')}</span><span class="v" style="font-size:18px">${show(net)}</span></div>`:''}
      <div class="field" style="margin-top:10px">
        <label>${t('discount')}</label>
        <div style="display:flex;gap:8px">
          <input id="co-disc" type="number" min="0" value="${CO.disc||''}" placeholder="0" style="flex:1">
          <div class="mini-seg">
            <button class="${CO.discMode==='IQD'?'on':''}" data-disc-mode="IQD">IQD</button>
            <button class="${CO.discMode==='%'?'on':''}" data-disc-mode="%">%</button>
          </div>
        </div>
      </div>
      <div class="field">
        <label>${t('paidAmount')}</label>
        <input id="co-paid" type="number" min="0" value="${isUsd?(CO.paid/S.fx).toFixed(2):Math.round(CO.paid)}">
      </div>
      <div class="kv"><span class="k">${t('change')}</span>
        <span class="v" style="color:${change>0?'var(--green)':'var(--muted)'}">${show(change)}</span></div>
      <div class="field" style="margin-top:10px">
        <label>${t('customerName')} <span style="opacity:.7">(${t('optional')})</span></label>
        <input id="co-cust" value="${esc(CO.customer)}" placeholder="${t('customerName')}">
      </div>
      <button class="btn btn-fill" style="width:100%;padding:14px" data-co="print">${icon('print',18)} ${t('confirmPrint')}</button>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost" data-x="1">${t('cancel')}</button>
      <button class="btn btn-amber" data-co="loan">${icon('receipt_long',18)} ${t('loanList')}</button>
      <button class="btn btn-green" data-co="ok">${icon('check_circle',18)} ${t('confirm')}</button>
    </div>
  </div>`);

  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
  document.querySelectorAll('[data-co-cur]').forEach(b=>b.onclick=()=>{CO.cur=b.dataset.coCur;drawCheckout();});
  document.querySelectorAll('[data-disc-mode]').forEach(b=>b.onclick=()=>{CO.discMode=b.dataset.discMode;CO.disc=0;syncCo();drawCheckout();});
  const dEl=$('#co-disc'), pEl=$('#co-paid'), cEl=$('#co-cust');
  const mul = CO.cur==='USD' ? S.fx : 1;
  dEl.oninput = ()=>{
    CO.disc = CO.discMode==='%' ? (+dEl.value||0) : (+dEl.value||0)*mul;
    const {net}=coTotals();
    CO.paid = net;
    pEl.value = CO.cur==='USD' ? (net/S.fx).toFixed(2) : Math.round(net);
    syncChange();
  };
  pEl.oninput = ()=>{ CO.paid=(+pEl.value||0)*mul; syncChange(); };
  cEl.oninput = ()=>{ CO.customer=cEl.value; };
  function syncCo(){}
  function syncChange(){
    const {change}=coTotals();
    const kvs=document.querySelectorAll('.mbody .kv');
    const last=kvs[kvs.length-1];
    if(last) last.querySelector('.v').innerHTML = CO.cur==='USD'?usd(change/S.fx):iqd(change);
  }
  document.querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>{
    const {net}=coTotals();
    if(b.dataset.co!=='loan' && (CO.paid||0) < net - 0.5){ toast(t('notEnough')); return; }
    finishSale(b.dataset.co);
  });
}
function finishSale(mode){
  const {gross,off,net,change} = coTotals();
  const items = cart().items.map(it=>{
    const p=prod(it.pid);
    const unitPrice = it.unit==='carton'?p.whole:p.price;
    const pieces = it.qty * (it.unit==='carton'?(p.dozen||1):1);
    const cost = p.buy * pieces;
    return {pid:p.id,name:p.name,en:p.en,unit:it.unit,qty:it.qty,pieces,unitPrice,line:unitPrice*it.qty,cost};
  });
  const ratio = gross>0 ? net/gross : 1;
  const sale = {
    id:S.nextSale++, ts:new Date(), date:todayISO(), cashier:S.user.name,
    items, gross, discount:off, total:net, paid:CO.paid, change, cur:CO.cur,
    customer:CO.customer, credit:mode==='loan',
    cost: items.reduce((s,i)=>s+i.cost,0),
    profit: items.reduce((s,i)=>s+(i.line*ratio - i.cost),0)
  };
  items.forEach(i=>{ const p=prod(i.pid); if(p) p.qty = Math.max(0, p.qty - i.pieces); });
  S.sales.push(sale);
  S.carts.splice(S.active,1);
  if(!S.carts.length) S.carts=[{id:Date.now(),items:[],cur:'IQD'}];
  S.active = Math.min(S.active, S.carts.length-1);
  closeModal(); render(); toast(t('saleDone'));
  if(mode==='print') receiptModal(sale);
}

function viewStock(){
  const u=S.ui;
  const today=todayISO(), month=today.slice(0,7);
  const lossToday=S.adjustments.filter(a=>a.date===today).reduce((s,a)=>s+a.loss,0);

  const newTab = `
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="stat s-red"><div><div class="lbl">${t('lossToday')}</div><div class="val">${iqd(lossToday)}</div></div>

      ${icon('search')}<span style="flex:1;${sel?'':'color:var(--muted)'}">${sel?esc(pname(sel)):t('searchNameBarcode')}</span>
      ${sel?`<span class="tag t-qty">${sel.qty}</span>`:''}
    </button>
    <div style="font-size:12px;color:var(--muted);margin:14px 0 6px">${t('reason')}</div>
    <div class="chips">${REASONS.map(([k,ic,col])=>`
      <button class="chip ${u.adjReason===k?'on':''}" data-reason="${k}"
        style="${u.adjReason===k?`background:${col};border-color:${col};color:#fff`:''}">${icon(ic,15)} ${t(k)}</button>`).join('')}</div>
    <div style="font-size:12px;color:var(--muted);margin:14px 0 6px">${t('qtyLost')}</div>
    <div style="display:flex;gap:8px;align-items:stretch">
      <button class="btn btn-line" data-aq="-1" style="width:56px">${icon('remove',20)}</button>

      <button class="btn btn-line" data-aq="1" style="width:56px">${icon('add',20)}</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin:14px 0 6px">${t('note')} (${t('optional')})</div>
    <textarea id="adj-note" rows="2" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px" placeholder="${t('noteHint')}">${esc(u.adjNote)}</textarea>
    ${sel?`<div class="kv" style="margin-top:10px"><span class="k">${t('estLoss')}</span>
      <span class="v" style="color:var(--red)">${iqd(sel.buy*u.adjQty)}</span></div>`:''}
    <button class="btn" style="width:100%;background:#F26B21;color:#fff;padding:16px;margin-top:14px" data-adjsave="1">
      ${icon('save',18)} ${t('saveAdj')}</button>`;

  const hist = S.adjustments.length ? `<table><thead><tr>
      <th>${t('colItem')}</th><th>${t('reason')}</th><th>${t('qtyLost')}</th><th>${t('estLoss')}</th><th>${t('time')}</th></tr></thead>
    <tbody>${[...S.adjustments].reverse().map(a=>`<tr>
      <td>${esc(a.name)}${a.note?`<div style="font-size:11px;color:var(--muted)">${esc(a.note)}</div>`:''}</td>
      <td>${t(a.reason)}</td><td class="num">${a.qty}</td>
      <td style="color:var(--red)">${iqd(a.loss)}</td>
      <td class="num">${dmy(a.date)}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">${icon('inventory')}<div>${t('noAdj')}</div></div>`;

  return `<div>
    <div style="font-size:17px;font-weight:700;margin-bottom:10px">${t('stock')}</div>
    <div class="seg" style="max-width:420px;margin-inline:auto">
      <button class="${u.stockTab==='new'?'on':''}" data-stab="new">${t('newAdj')}</button>
      <button class="${u.stockTab==='hist'?'on':''}" data-stab="hist">${t('history')}</button>
    </div>
    ${u.stockTab==='new'?newTab:hist}

function bindStock(){
  const u=S.ui;
  document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{u.stockTab=b.dataset.stab;render();});
  document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{u.adjReason=b.dataset.reason;render();});
  document.querySelectorAll('[data-aq]').forEach(b=>b.onclick=()=>{
    u.adjQty=Math.max(1,u.adjQty+ +b.dataset.aq); render();});
  const nt=$('#adj-note'); if(nt) nt.oninput=()=>{u.adjNote=nt.value;};
  const pick=document.querySelector('[data-adjpick]');
  if(pick) pick.onclick=()=>pickerModal(p=>{u.adjPid=p.id;closeModal();render();});
  const sv=document.querySelector('[data-adjsave]');
  if(sv) sv.onclick=()=>{
    const p=u.adjPid?prod(u.adjPid):null;
    if(!p){ toast(t('pickItem')); return; }
    const qty=Math.min(u.adjQty,p.qty||u.adjQty);
    S.adjustments.push({id:Date.now(),pid:p.id,name:pname(p),reason:u.adjReason,qty,
      loss:p.buy*qty,note:u.adjNote,date:todayISO()});
    p.qty=Math.max(0,p.qty-qty);
    u.adjPid=null;u.adjQty=1;u.adjNote='';u.stockTab='hist';
    render(); toast(t('adjDone'));
  };
}

function viewReports(){
  const u=S.ui;
  const tabs=[['tabDaily','receipt_long'],['tabStats','bar_chart'],['tabTop','emoji_events'],
              ['tabExpiry','warning'],['tabByCashier','group'],['tabInv','inventory_2']];
  const nav=`<div style="display:flex;gap:6px;background:#2C3A42;border-radius:14px;padding:6px;margin-bottom:12px;overflow-x:auto">
    ${tabs.map(([k,ic])=>`<button data-rtab="${k}" style="flex:1;min-width:112px;padding:12px 8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;
      ${u.repTab===k?'background:#fff;color:var(--ink)':'color:#B0BEC5'}">${icon(ic,18)}<span>${t(k)}</span></button>`).join('')}
  </div>`;
  let body='';
  if(u.repTab==='tabInv') body=repInventory();

function bindReports(){
  const u=S.ui;
  document.querySelectorAll('[data-rtab]').forEach(b=>b.onclick=()=>{u.repTab=b.dataset.rtab;render();});
  document.querySelectorAll('[data-invf]').forEach(b=>b.onclick=()=>{u.invFilter=b.dataset.invf;render();});
  const iq=$('#invq'); if(iq) iq.oninput=()=>{const p=iq.selectionStart;u.invQ=iq.value;render();
    const n=$('#invq');n.focus();n.setSelectionRange(p,p);};
  document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{u.statPeriod=b.dataset.period;render();});
  const sd=$('#statdate'); if(sd) sd.onchange=()=>{u.statDate=sd.value;render();};
  const dd=$('#dailydate'); if(dd) dd.onchange=()=>{u.dailyDate=dd.value;render();};
  document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{
    const d=new Date(u.statDate); const n=+b.dataset.shift;

function downloadCsv(){
  const head=['#','name','barcode','price','buy','qty','cartons'];
  const rows=S.products.map((p,i)=>[i+1,p.name,p.barcode,p.price,p.buy,p.qty,boxes(p)]);
  const csv='\uFEFF'+[head,...rows].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='nova-inventory-demo.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast(S.lang==='ku'?'داونلۆد کرا':'Downloaded');
}

const soldOf = pid => S.sales.reduce((s,sale)=>s+sale.items.filter(i=>i.pid===pid).reduce((a,i)=>a+i.pieces,0),0);

function rangeOf(){
  const u=S.ui, d=new Date(u.statDate);
  if(u.statPeriod==='daily') return {from:u.statDate,to:u.statDate,label:dmy(u.statDate)};
  if(u.statPeriod==='weekly'){
    const s=new Date(d); s.setDate(d.getDate()-((d.getDay()+1)%7));
    const e=new Date(s); e.setDate(s.getDate()+6);
    return {from:s.toISOString().slice(0,10),to:e.toISOString().slice(0,10),
      label:`${dmy(s.toISOString().slice(0,10))} — ${dmy(e.toISOString().slice(0,10))}`};
  }
  const s=new Date(d.getFullYear(),d.getMonth(),1), e=new Date(d.getFullYear(),d.getMonth()+1,0);
  return {from:s.toISOString().slice(0,10),to:e.toISOString().slice(0,10),
    label:`${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`};
}

      <div style="flex:1;text-align:end;color:var(--muted);font-size:12px">${profit>0?'':t('noProfit')}</div>
      <div class="ic">${icon('trending_up',18)}</div></div>
    ${rows.length?salesTable(rows):`<div class="empty">${icon('bar_chart')}<div>${t('noSales')}</div></div>`}`;
}
function repTop(){
  const map={};
  S.sales.forEach(s=>s.items.forEach(i=>{
    map[i.pid]=map[i.pid]||{name:S.lang==='ku'?i.name:(i.en||i.name),qty:0,rev:0};
    map[i.pid].qty+=i.pieces; map[i.pid].rev+=i.line;
  }));
  const list=Object.values(map).sort((a,b)=>b.qty-a.qty);
  const max=list.length?list[0].qty:1;
  if(!list.length) return `<div class="empty">${icon('emoji_events')}<div>${t('noSales')}</div></div>`;
  return `<div class="card" style="padding:14px">
    ${list.map((x,i)=>`<div style="margin-bottom:12px">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">
        <span class="tag ${i<3?'t-buy':'t-iqd'}" style="min-width:22px;text-align:center">${i+1}</span>
        <span style="flex:1;font-weight:600">${esc(x.name)}</span>
        <span class="num" style="color:var(--muted);font-size:12px">${t('qtySold')}: ${x.qty}</span>
        <span style="font-weight:700">${iqd(x.rev)}</span>
      </div>
      <div style="height:7px;border-radius:99px;background:#EDF1F3;overflow:hidden">
        <div style="height:100%;width:${(x.qty/max*100).toFixed(0)}%;background:linear-gradient(90deg,#F2A33C,#F26B21)"></div>
      </div></div>`).join('')}</div>`;
}
function repExpiry(){
  const list=S.products.filter(p=>p.exp).map(p=>({p,d:daysTo(p.exp)}))
    .filter(x=>x.d<=45).sort((a,b)=>a.d-b.d);
  if(!list.length) return `<div class="empty">${icon('event_available')}<div>${t('noExpiry')}</div></div>`;
  return `<table><thead><tr><th>${t('colItem')}</th><th>${t('expiresOn')}</th><th>${t('colLeft')}</th><th>${t('qtyLabel')}</th></tr></thead>
    <tbody>${list.map(({p,d})=>`<tr>
      <td>${esc(pname(p))}</td><td class="num">${dmy(p.exp)}</td>
      <td><span class="tag" style="background:${d<0?'#FBEAE8':d<=7?'#FDF3E3':'#EDF1F3'};color:${d<0?'var(--red)':d<=7?'#A96A12':'var(--ink)'}">
        ${d<0?t('expiredAlready'):`${d} ${t('daysLeft')}`}</span></td>
      <td class="num">${p.qty}</td></tr>`).join('')}</tbody></table>`;
}
function repCashier(){
  const map={};
  S.sales.forEach(s=>{ map[s.cashier]=map[s.cashier]||{n:0,total:0,profit:0}; 
    map[s.cashier].n++; map[s.cashier].total+=s.total; map[s.cashier].profit+=s.profit; });
  const list=Object.entries(map);
  if(!list.length) return `<div class="empty">${icon('group')}<div>${t('noSales')}</div></div>`;
  return `<table><thead><tr><th>${t('cashierName')}</th><th>${t('salesCount')}</th><th>${t('revenue')}</th><th>${t('profit')}</th></tr></thead>
    <tbody>${list.map(([k,v])=>`<tr><td style="font-weight:600">${esc(k)}</td><td class="num">${v.n}</td>
      <td>${iqd(v.total)}</td><td style="color:var(--green)">${iqd(v.profit)}</td></tr>`).join('')}</tbody></table>`;
}

/* ----------------------------- bind router ----------------------------- */
function bindScreen(){
  if(S.screen==='cashier') bindCashier();
  if(S.screen==='products') bindProducts();
  if(S.screen==='stock') bindStock();
  if(S.screen==='reports') bindReports();
}

/* keyboard shortcuts, mirroring the desktop build */
document.addEventListener('keydown', e=>{
  if(!S || !S.user) return;
  if($('#modal-root').innerHTML && e.key==='Escape'){ closeModal(); return; }
  if(S.screen!=='cashier') return;
  const map={F1:'history',F4:'pay',F5:'newtab',F6:'clear',F7:'search',F10:'search'};
  if(map[e.key]){
    e.preventDefault();
    const b=document.querySelector(`[data-fk="${map[e.key]}"]`);
    if(b && !b.disabled) b.click();
  }
});

/* ----------------------------- boot ----------------------------- */
S = seed();
render();
</script>
</body>
</html>
